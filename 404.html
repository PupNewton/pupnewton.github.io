<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — pupnewton</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="dialog-wrap">
    <div class="dialog">

      <div class="title-bar">
        <span class="box" aria-hidden="true"></span>
        <h1>System Error</h1>
      </div>

      <div class="dialog-body">
        <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="19" r="11" fill="none" stroke="#1A1A18" stroke-width="2"/>
          <line x1="20" y1="10" x2="26" y2="4" stroke="#1A1A18" stroke-width="2"/>
          <line x1="23" y1="3" x2="27" y2="7" stroke="#1A1A18" stroke-width="2"/>
          <line x1="12" y1="16" x2="14" y2="22" stroke="#1A1A18" stroke-width="1.5"/>
          <line x1="16" y1="14" x2="16" y2="22" stroke="#1A1A18" stroke-width="1.5"/>
          <line x1="20" y1="16" x2="18" y2="22" stroke="#1A1A18" stroke-width="1.5"/>
        </svg>
        <div class="msg">
          <p class="headline">This page could not be found.</p>
          <p>The document you're looking for was moved, renamed, or never existed on this volume.</p>
        </div>
      </div>

      <div class="dialog-actions">
        <a href="/">Restart</a>
      </div>

    </div>
  </div>
</body>
</html>
